name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Every build gets a higher number than the last, so the TV can tell
      # which is newer. (+100 keeps it above the hand-numbered early builds.)
      - name: Set build number
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: cleanhome-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publish the build where the app's "Update" link looks for it.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$VERSION_CODE" > version.txt
          gh release create "v$VERSION_CODE" \
            app/build/outputs/apk/debug/app-debug.apk version.txt \
            --title "Clean Home build $VERSION_CODE" \
            --notes "$(git log -1 --pretty=%s)"
